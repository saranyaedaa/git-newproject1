<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Tasty Restaurant</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h2>Welcome to Tasty Restaurant</h2>
        <p>Delicious Food, Great Ambience</p>
        <button onclick="showMessage()">Order Now</button>
    </section>

    <section id="menu">
        <h2>Our Menu</h2>
        <div class="menu-container">
            <div class="item">
                <h3>Pizza</h3>
                <p>₹250</p>
            </div>
            <div class="item">
                <h3>Burger</h3>
                <p>₹150</p>
            </div>
            <div class="item">
                <h3>Pasta</h3>
                <p>₹200</p>
            </div>
        </div>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>We serve fresh and tasty food every day.</p>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>Email: tastyrestaurant@gmail.com</p>
        <p>Phone: +91 9876543210</p>
    </section>

    <footer>
        <p>&copy; 2026 Tasty Restaurant</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
